<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Nick Polyderopoulos</title>
	<base href="/" />
	<link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
	<!-- Important: Increment the version parameter whenever you update MudBlazor to prevent caching issues -->
	<link href="_content/MudBlazor/MudBlazor.min.css?v=1" rel="stylesheet" />
	<link href="css/app.css" rel="stylesheet" />
	<link id="prism-theme" href="css/prism-dark.css" rel="stylesheet" />
	<link rel="icon" type="image/png" href="favicon.png" />
	<link href="manifest.webmanifest" rel="manifest" />
	<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
	<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
	<style>
		/* Loading screen styles */
		#loading-area {
			background-color: rgba(26,26,39,1);
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}

		#app {
			height: 100vh;
		}

		.spinner {
			width: 56px;
			height: 56px;
			border: 8px solid #e0e0e0;
			border-top: 8px solid #3f51b5;
			border-radius: 50%;
			animation: spin 1s linear infinite;
			margin-bottom: 18px;
		}

		@keyframes spin {
			0% {
				transform: rotate(0deg);
			}

			100% {
				transform: rotate(360deg);
			}
		}

		.loading-progress-text {
			font-family: inherit;
			font-size: 1.3rem;
			color: rgba(178,176,191,1);
			margin-top: 6px;
			letter-spacing: 1px;
		}
	</style>
</head>
<body>
	<div id="app" role="status" aria-live="polite">
		<div id="loading-area">
			<div class="spinner"></div>
			<div class="loading-progress-text">
				Loading application&hellip;
			</div>
		</div>
	</div>
	<div id="blazor-error-ui">
		An unhandled error has occurred.
		<a href="." class="reload">Reload</a>
		<span class="dismiss">🗙</span>
	</div>
	<script src="_framework/blazor.webassembly.js"></script>
	<script src="_content/MudBlazor/MudBlazor.min.js?v=1"></script>
	<script src="_content/Blazorade.Core/js/blazoradeCore.js?v=1"></script>
	<script src="js/prism.js"></script>
	<script src="js/app.js"></script>
	<script>navigator.serviceWorker.register('service-worker.js');</script>

</body>
</html>
